<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Mystery World Tour</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#08182c;color:white}.app{max-width:980px;margin:auto;padding:20px}.hero{background:radial-gradient(circle at 50% 35%,#266c9c,#0d2948 50%,#08182c);border:1px solid #356080;border-radius:22px;padding:25px;text-align:center;position:relative;overflow:hidden}.earth{font-size:90px;filter:drop-shadow(0 0 20px #3ea2df)}.eyebrow{color:#f8ce78;letter-spacing:3px;font-size:13px;font-weight:bold}h1{font-size:clamp(26px,5vw,48px);margin:12px 0}p{color:#d5e5f4}.route{display:flex;gap:8px;margin:22px 0}.segment{height:8px;border-radius:8px;flex:1;background:#30445c}.segment.done{background:#26a889}.segment.active{background:#f6c977}.panel{background:#122b47;border:1px solid #315674;border-radius:20px;padding:24px;max-width:690px;margin:20px auto;text-align:center}.flag{font-size:55px}.show{color:#f9cb73;font-size:24px;font-weight:bold;margin:8px}.question{font-size:22px;margin:20px 0}.choices{display:grid;gap:10px}.choice,.next{width:100%;border:1px solid #526c88;border-radius:12px;background:#263e59;color:white;padding:15px;font-size:17px;cursor:pointer;text-align:left}.choice:hover{background:#345779}.choice.right{background:#126e59;border-color:#8aeac7}.choice.wrong{background:#873d4b}.next{background:#f0c46b;color:#15243a;text-align:center;font-weight:bold;border:0;margin-top:15px}.status{min-height:30px;margin-top:16px;font-weight:bold;color:#8be8c4}.passport{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px auto}.stamp{border:2px dashed #4c7294;border-radius:50%;height:54px;width:54px;display:grid;place-items:center;color:#7698b7;font-size:22px}.stamp.earned{border-color:#f6cb77;color:#f6cb77;transform:rotate(-10deg)}.final{font-size:clamp(29px,5vw,48px);color:#f8cb76}footer{text-align:center;color:#a8bdd0;font-size:12px;margin:24px}.tag{display:inline-block;border:1px solid #6181a0;padding:7px 12px;border-radius:20px;font-size:12px;color:#d5e6f4}button:focus-visible{outline:3px solid #f9cb73;outline-offset:3px}@media(max-width:500px){.app{padding:10px}.panel{padding:16px}.question{font-size:19px}}</style></head><body><main class="app"><header class="hero"><div class="eyebrow">✈ THE MYSTERY WORLD TOUR ✈</div><div class="earth">🌍</div><h1 id="heading">Discover the Secret Unit</h1><p id="subtitle">6 Stops · 6 Clues · 1 Secret Destination</p><span class="tag" id="progress">READY FOR TAKEOFF</span></header><div class="route" id="route"></div><section class="panel" id="panel" aria-live="polite"></section><div class="passport" id="passport" aria-label="Passport stamps"></div><footer>Teacher: Ghaliah Al-Shamrani</footer></main><script>const stops=[{place:'United States',flag:'🇺🇸',show:'Jeopardy!',q:'What kind of TV show tests general knowledge?',options:['Quiz show','Cooking show','Sports show'],answer:0,clue:'TV'},{place:'Latin America',flag:'🌎',show:'Hoy',q:'When is Hoy broadcast?',options:['At midnight','In the morning','In the evening'],answer:1,clue:'AROUND'},{place:'Worldwide',flag:'🌿',show:'National Geographic',q:'What can you discover on National Geographic?',options:['Nature and science','Only cars','Only cooking'],answer:0,clue:'THE'},{place:'United States',flag:'🔎',show:'CSI',q:'What do forensic scientists investigate?',options:['Car races','Mysteries and crimes','Cooking recipes'],answer:1,clue:'WORLD'},{place:'United Kingdom',flag:'🇬🇧',show:'Top Gear',q:'What is Top Gear mainly about?',options:['Animals','Cars','History'],answer:1,clue:'🌍'},{place:'Japan',flag:'🇯🇵',show:'Sasuke',q:'What do contestants complete in Sasuke?',options:['Obstacle courses','Science quizzes','Cooking challenges'],answer:0,clue:'📺'}];let step=0,solved=false,finished=false;const $=id=>document.getElementById(id);function render(){ $('route').innerHTML=stops.map((s,i)=>'<div class="segment '+(finished||i<step?'done':i===step?'active':'')+'"></div>').join('');$('passport').innerHTML=stops.map((s,i)=>'<div class="stamp '+(finished||i<step?'earned':'')+'" title="'+s.show+'">'+(finished||i<step?'✓':'✦')+'</div>').join('');if(finished){$('heading').textContent='MISSION COMPLETE!';$('subtitle').textContent='You discovered the mystery!';$('progress').textContent='6 / 6 STAMPS COLLECTED';$('panel').innerHTML='<div style="font-size:65px">🏆</div><div class="eyebrow">YOUR SECRET UNIT IS...</div><h2 class="final">UNIT 4<br>TV AROUND THE WORLD</h2><p>Congratulations, Global Explorer! You visited six television programs from around the world.</p><button class="next" id="restart">↻ Start a New Journey</button>';$('restart').addEventListener('click',()=>{step=0;solved=false;finished=false;render()});return}const s=stops[step];$('heading').textContent='Discover the Secret Unit';$('subtitle').textContent='Collect all six clues to reveal the unit title';$('progress').textContent='DESTINATION '+(step+1)+' OF 6';$('panel').innerHTML='<span class="tag">STOP '+(step+1)+'</span><div class="flag">'+s.flag+'</div><h2>'+s.place+'</h2><div class="show">'+s.show+'</div><div class="question">'+s.q+'</div><div class="choices">'+s.options.map((o,i)=>'<button class="choice" data-choice="'+i+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'</div><div class="status" id="status"></div><div id="advance"></div>';document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(solved)return;const i=Number(b.dataset.choice);if(i===s.answer){solved=true;b.classList.add('right');$('status').textContent='✓ Correct! Secret clue unlocked: '+s.clue;document.querySelectorAll('.choice').forEach(x=>x.disabled=true);$('advance').innerHTML='<button class="next" id="next">'+(step===5?'Reveal the Secret Unit ✨':'Fly to Next Destination →')+'</button>';$('next').addEventListener('click',()=>{if(step===5)finished=true;else step++;solved=false;render()})}else{b.classList.add('wrong');$('status').textContent='Try another answer!';$('status').style.color='#ffb4b4'}}))}render();</script></body></html>
